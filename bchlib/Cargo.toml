[package]
name = "bchlib"
version = "0.2.1"
authors = ["Yuval Adam <_@yuv.al>"]
edition = "2018"
description = "Rust bindings for BCH encoding/decoding library, based on the bch_codec fork"
license = "GPL-2.0"
documentation = "https://docs.rs/bchlib/"
homepage = "https://github.com/yuvadm/bchlib"
repository = "https://github.com/yuvadm/bchlib"

[dependencies]
bchlib-sys = { version = "0.2.1", default-features = false, path = "../bchlib-sys" }

[features]
default = ["std", "malloc", "decode"]
std = ["bchlib-sys/std"]
# Use the system allocator (malloc/free) instead of the small fixed-size
# static pool intended for no_std/embedded targets. Hosted builds should
# enable this; only disable it for memory-constrained embedded targets.
malloc = ["bchlib-sys/malloc"]
# Compile in decode_bch/correct_bch support. Disable on memory-constrained
# encode-only (no_std) targets to shrink the static alloc_heap pool.
decode = ["bchlib-sys/decode"]
