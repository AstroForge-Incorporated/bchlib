[package]
name = "bchlib-sys"
version = "0.2.1"
authors = ["Yuval Adam <_@yuv.al>"]
edition = "2018"
description = "Low-level Rust bindings for BCH encoding/decoding library, based on the bch_codec fork"
license = "GPL-2.0"
documentation = "https://docs.rs/bchlib-sys/"
homepage = "https://github.com/yuvadm/bchlib"
repository = "https://github.com/yuvadm/bchlib"

[build-dependencies]
bindgen = "0.69.5"
cc = "1.0"

[features]
default = ["std", "malloc", "decode"]
std = []
# Use the system allocator (malloc/free) instead of the small fixed-size
# static pool intended for no_std/embedded targets. Hosted builds should
# enable this; only disable it for memory-constrained embedded targets.
malloc = []
# Compile in decode_bch/correct_bch and their supporting tables. Disable this
# on memory-constrained encode-only (no_std) targets to shrink the static
# alloc_heap pool: it drops ecc_buf2, xi_tab, syn, cache, elp, and the
# poly_2t scratch polynomials, and decode_bch becomes a stub returning
# -EINVAL instead of decoding.
decode = []
